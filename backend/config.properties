[DEFAULT]
rate_limit=10/minute
authenticator.username=admin
authenticator.password=password
supported_formats=jpeg,png,pdf,tiff,mp4
output_dir=/tmp/dicom-output
BASE_UID_PREFIX=1.2.840.10008.

# [DEBUG INFO WARNING ERROR CRITICAL]
log_level=INFO 

# DICOM Validation Settings
dicom_whitelist_tags=PatientName,PatientID,StudyDate,Modality,InstitutionName,StudyInstanceUID
dicom_auto_generate_tags=StudyInstanceUID,SOPInstanceUID
dicom_max_tags=100
dicom_max_value_length=256

[CLIENTS]
client1.username=user1
client1.password=password123
client2.username=user
client2.password=securepass456