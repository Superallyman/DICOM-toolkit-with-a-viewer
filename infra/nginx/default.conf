server {
  listen 80;
  server_name _;

  client_max_body_size 1024m;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dicom-web/ {
    proxy_pass http://orthanc:8042/dicom-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /wado {
    proxy_pass http://orthanc:8042/wado;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /viewer/ {
    proxy_pass http://viewer/;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 404 = /viewer/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OHIF's production build references several static assets from the domain
  # root even when the app is mounted under /viewer. Keep these requests on the
  # viewer service so the Next.js app does not swallow them.
  location = /app-config.js {
    proxy_pass http://viewer/app-config.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store";
  }

  location = /app.bundle.css {
    proxy_pass http://viewer/app.bundle.css;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/[A-Za-z0-9._-]+(\.bundle\.[A-Za-z0-9]+\.js|\.bundle\.[A-Za-z0-9]+\.js\.map|\.css|\.css\.map|\.min\.js|\.js|\.js\.map|\.wasm)$ {
    proxy_pass http://viewer$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /manifest.json {
    proxy_pass http://viewer/manifest.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /init-service-worker.js {
    proxy_pass http://viewer/init-service-worker.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store";
  }

  location = /sw.js {
    proxy_pass http://viewer/sw.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    proxy_pass http://viewer/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ort/ {
    proxy_pass http://viewer/ort/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /dicom-microscopy-viewer/ {
    proxy_pass http://viewer/dicom-microscopy-viewer/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
